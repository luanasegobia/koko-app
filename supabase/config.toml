# Proyecto de Supabase compartido para desarrollo.
# Para trabajar en la app NO hace falta la CLI: alcanza con el .env.local.
# La CLI solo se necesita para aplicar migraciones (`supabase link` + `db push`).
project_id = "knvocftylpunbzycoarx"

[auth]
enabled = true
# Necesarias para que vuelvan bien el login con Google y el reseteo de contraseña.
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:5173/**"]

[edge_functions]
enabled = true

[functions.create-checkout-session]
# verify_jwt no exige una persona con sesión: la clave anónima también es un JWT
# válido, y donar sin cuenta es un caso de uso. Lo que protege a la función es
# que valida el monto, lee el caso de la base y arma ella las URLs de retorno.
# Necesita los secretos STRIPE_SECRET_KEY y, en producción, ORIGENES_PERMITIDOS.
verify_jwt = true
