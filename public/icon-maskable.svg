<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="koko-maskable-title">
  <title id="koko-maskable-title">Koko</title>
  <!-- Origen de los PNG adaptables de Android y del apple-touch-icon.
       Sin esquinas redondeadas (el sistema aplica su propia máscara) y con
       la pata dentro de la zona segura: el contenido entra en el círculo
       interior del 80% del lienzo. -->
  <rect width="64" height="64" fill="#2E51C8"/>
  <g transform="translate(12.85,12.85) scale(1.596)" fill="#FFFFFF">
    <circle cx="4.4" cy="7.4" r="2.4"/>
    <circle cx="9.4" cy="5.0" r="2.4"/>
    <circle cx="14.6" cy="5.0" r="2.4"/>
    <circle cx="19.6" cy="7.4" r="2.4"/>
    <ellipse cx="12" cy="16.4" rx="6.5" ry="5.0"/>
  </g>
</svg>
