<form class="formulario" [formGroup]="formulario" (ngSubmit)="guardar()">
  <div class="campos-en-fila">
    <ion-input label="Nombre" labelPlacement="stacked" fill="outline" formControlName="name" placeholder="Ej: Luna" errorText="El nombre es obligatorio"></ion-input>
    <ion-select label="Especie" labelPlacement="stacked" fill="outline" formControlName="species" interface="popover">
      <ion-select-option value="perro">Perro</ion-select-option>
      <ion-select-option value="gato">Gato</ion-select-option>
      <ion-select-option value="otro">Otro</ion-select-option>
    </ion-select>
  </div>

  <div class="campos-en-fila-tres">
    <ion-input label="Raza" labelPlacement="stacked" fill="outline" formControlName="breed" placeholder="Ej: Golden"></ion-input>
    <ion-input label="Edad" labelPlacement="stacked" fill="outline" type="number" inputmode="numeric" [min]="0" formControlName="age_years"
      errorText="La edad no puede ser negativa" placeholder="Años"></ion-input>
    <ion-select label="Sexo" labelPlacement="stacked" fill="outline" formControlName="sex" interface="popover">
      <ion-select-option value="macho">Macho</ion-select-option>
      <ion-select-option value="hembra">Hembra</ion-select-option>
    </ion-select>
  </div>

  <ion-select label="Tamaño" labelPlacement="stacked" fill="outline" formControlName="size" interface="popover">
    <ion-select-option value="pequeño">Pequeño</ion-select-option>
    <ion-select-option value="mediano">Mediano</ion-select-option>
    <ion-select-option value="grande">Grande</ion-select-option>
  </ion-select>

  <ion-textarea label="Descripción" labelPlacement="stacked" fill="outline" formControlName="description" placeholder="Temperamento, necesidades..." [rows]="3" [autoGrow]="true"></ion-textarea>

  <div class="campos-en-fila">
    <ion-item lines="none">
      <ion-label>Vacunado</ion-label>
      <ion-toggle slot="end" formControlName="vaccinated" aria-label="Vacunado"></ion-toggle>
    </ion-item>
    <ion-item lines="none">
      <ion-label>Esterilizado</ion-label>
      <ion-toggle slot="end" formControlName="sterilized" aria-label="Esterilizado"></ion-toggle>
    </ion-item>
  </div>

  <div class="campos-en-fila">
    <ion-input label="Tu nombre" labelPlacement="stacked" fill="outline" formControlName="contact_name"></ion-input>
    <ion-input label="Teléfono" labelPlacement="stacked" fill="outline" type="tel" formControlName="contact_phone"></ion-input>
  </div>

  <ion-input label="Ubicación / Barrio" labelPlacement="stacked" fill="outline" formControlName="location" placeholder="Ej: Barrio Centro, Orán"></ion-input>

  <div class="pila-chica">
    <p class="etiqueta-campo">Foto</p>
    <app-selector-foto [fotoActual]="registroInicial()?.photo_url" (archivos)="alElegirFoto($event)" />
  </div>

  @if (error()) {
    <p class="error-formulario">{{ error() }}</p>
  }

  <ion-button type="submit" expand="block" [disabled]="guardando()">
    @if (guardando()) {
      <ion-spinner slot="start" name="crescent"></ion-spinner>
    } @else {
      <ion-icon slot="start" name="cloud-upload-outline"></ion-icon>
    }
    {{ editando ? 'Guardar cambios' : 'Publicar' }}
  </ion-button>
</form>
