<form class="formulario" [formGroup]="formulario" (ngSubmit)="guardar()">
  <ion-input
    label="Título del caso"
    labelPlacement="stacked"
    fill="outline"
    formControlName="title"
    placeholder="Ej: Perrita encontrada en ruta 50"
    errorText="El título es obligatorio"
  ></ion-input>

  <ion-textarea
    label="Descripción"
    labelPlacement="stacked"
    fill="outline"
    formControlName="description"
    placeholder="Detallá la situación, qué se necesita..."
    [rows]="3"
    [autoGrow]="true"
    errorText="La descripción es obligatoria"
  ></ion-textarea>

  <div class="campos-en-fila">
    <ion-input label="Publicado por" labelPlacement="stacked" fill="outline" formControlName="published_by" placeholder="Nombre u organización"></ion-input>
    <ion-input label="Meta de recaudación ($)" labelPlacement="stacked" fill="outline" type="number" inputmode="numeric" [min]="0" formControlName="goal_amount" errorText="La meta no puede ser negativa" placeholder="Ej: 45000"></ion-input>
  </div>

  <ion-input label="Alias para donaciones" labelPlacement="stacked" fill="outline" formControlName="donation_alias" placeholder="Ej: rescatistas.oran"></ion-input>

  <div class="pila-chica" formArrayName="necesidades">
    <p class="etiqueta-campo">Tipo de ayuda necesaria</p>
    @for (control of necesidades.controls; track control; let i = $index) {
      <div class="necesidad">
        <ion-input [formControlName]="i" fill="outline" placeholder="Ej: Traslado, Cirugía, Medicamentos..." aria-label="Necesidad"></ion-input>
        @if (necesidades.length > 1) {
          <ion-button type="button" fill="clear" color="medium" (click)="quitarNecesidad(i)" aria-label="Quitar">
            <ion-icon slot="icon-only" name="close"></ion-icon>
          </ion-button>
        }
      </div>
    }
    <ion-button type="button" fill="outline" size="small" class="agregar" (click)="agregarNecesidad()">
      <ion-icon slot="start" name="add"></ion-icon>
      Agregar
    </ion-button>
  </div>

  <div class="pila-chica">
    <p class="etiqueta-campo">Foto</p>
    <app-selector-foto [fotoActual]="registroInicial()?.photo_url" (archivos)="alElegirFoto($event)" />
  </div>

  @if (error()) {
    <p class="error-formulario">{{ error() }}</p>
  }

  <ion-button type="submit" expand="block" [disabled]="guardando()">
    @if (guardando()) {
      <ion-spinner slot="start" name="crescent"></ion-spinner>
    } @else {
      <ion-icon slot="start" name="cloud-upload-outline"></ion-icon>
    }
    {{ editando ? 'Guardar cambios' : 'Publicar caso' }}
  </ion-button>
</form>
